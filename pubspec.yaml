name: seizure_app
description: "User-triggered seizure safety alerts and caregiver coordination."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  firebase_app_check: ^0.4.8
  firebase_messaging: ^16.1.1
  connectivity_plus: ^6.1.5
  flutter_local_notifications: ^20.0.0
  get: ^4.7.3
  firebase_auth: ^6.1.4
  shared_preferences: ^2.5.4
  flutter_svg: ^2.2.3
  cloud_firestore: ^6.3.0
  permission_handler: ^12.0.1
  app_settings: ^7.0.0
  geolocator: ^13.0.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.0
  url_launcher: ^6.3.0
  cloud_functions: ^6.3.5
  phone_numbers_parser: 9.0.28
  flutter_native_splash: ^2.4.8
  home_widget: ^0.10.0
  firebase_crashlytics: ^5.4.0
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  pdf: ^3.12.0
  timezone: ^0.10.1
  flutter_timezone: 5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_cloud_firestore: ^4.0.0
  flutter_lints: ^6.0.0
flutter_native_splash:
  color: "#000000"
  android: true
  ios: true
  web: false
  android_12:
    color: "#000000"

flutter:
  uses-material-design: true
  assets:
     - assets/
     - assets/images/
  fonts:
    - family: RedHatDisplay
      fonts:
        - asset: assets/fonts/RedHatDisplay-Light.ttf
          weight: 300
        - asset: assets/fonts/RedHatDisplay-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/RedHatDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/RedHatDisplay-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/RedHatDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/RedHatDisplay-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/RedHatDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/RedHatDisplay-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/RedHatDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/RedHatDisplay-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/RedHatDisplay-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/RedHatDisplay-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/RedHatDisplay-Black.ttf
          weight: 900
        - asset: assets/fonts/RedHatDisplay-BlackItalic.ttf
          weight: 900
          style: italic
