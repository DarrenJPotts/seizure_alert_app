
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: '#9c9a92' ,
    textColor: '#c2c0b6',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  USERS ||--o{ CONTACTS : "has many"
  USERS ||--o{ SEIZURE_LOGS : "has many"
  USERS ||--o{ ALERTS : "has many"
  USERS ||--o{ HEADS_UP : "has many"
  ALERTS ||--o{ ALERT_RESPONSES : "has many"
  HEADS_UP ||--o{ ALERT_RESPONSES : "has many"

  USERS {
    string uid PK
    string email
    string displayName
    string photoUrl
    string bloodType
    string seizureType
    string medications
    string emergencyNote
    timestamp createdAt
    timestamp updatedAt
  }

  CONTACTS {
    string id PK
    string userId FK
    string name
    string phone
    string relation
    int priority
    bool notifyViaSms
    bool notifyViaPush
    timestamp createdAt
  }

  SEIZURE_LOGS {
    string id PK
    string userId FK
    timestamp occurredAt
    int durationSeconds
    string location
    float latitude
    float longitude
    string notes
    string trigger
    bool alertFired
    string alertId FK
  }

  ALERTS {
    string id PK
    string userId FK
    string type
    string status
    float latitude
    float longitude
    string locationLabel
    string message
    timestamp createdAt
    timestamp resolvedAt
  }

  HEADS_UP {
    string id PK
    string userId FK
    timestamp createdAt
    timestamp expiresAt
    string note
    string status
    int windowMinutes
  }

  ALERT_RESPONSES {
    string id PK
    string alertId FK
    string contactId FK
    string contactName
    bool seen
    bool responding
    timestamp seenAt
    timestamp respondedAt
  }
`);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
